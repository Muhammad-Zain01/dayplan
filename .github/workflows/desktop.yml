name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package-script: package:mac:ci
            artifact-name: dayplan-macos
            artifact-path: release/*.dmg
          - os: windows-latest
            package-script: package:win
            artifact-name: dayplan-windows
            artifact-path: release/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm ci runs electron-builder's install-app-deps hook, which builds
      # better-sqlite3 for Electron. Rebuild it for the host Node runtime
      # before Vitest loads it; the packaging step rebuilds it for Electron again.
      - run: npm rebuild better-sqlite3
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.package-script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish macOS and Windows installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
