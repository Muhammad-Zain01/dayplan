<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title description">
  <title id="title">Dayplan logo for light backgrounds</title>
  <desc id="description">An orange rising sun and teal horizon beside the Dayplan wordmark.</desc>
  <defs>
    <clipPath id="sun-cap-light" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="192" height="111"/></clipPath>
  </defs>
  <g transform="translate(22 10) scale(0.9)" aria-hidden="true">
    <circle cx="96" cy="96" r="47" fill="#F58234" clip-path="url(#sun-cap-light)"/>
    <rect x="12" y="111" width="168" height="16" rx="8" fill="#348E7C"/>
  </g>
  <text x="215" y="122" fill="#242B2E" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="650" letter-spacing="-2.4">Dayplan</text>
</svg>
